[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_pgsql", "php83Extensions.pgsql",
           "php83Extensions.mbstring", "php83Extensions.tokenizer",
           "php83Extensions.xml", "php83Extensions.ctype", "php83Extensions.curl",
           "php83Extensions.fileinfo", "php83Extensions.bcmath",
           "php83Extensions.zip", "php83Extensions.gd", "php83Extensions.intl",
           "composer", "nodejs_22", "python311", "python311Packages.pip"]
# nodejs_22, not nodejs_20: Vite 7 requires node ^20.19.0 || >=22.12.0, and the
# nodejs_20 nix package is not guaranteed to sit above 20.19. A build against an
# older 20.x fails at `npm run build`, which would ship a deploy with no
# compiled assets.

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci",
    "pip install -r ../engine/requirements.txt"
]

[phases.build]
cmds = ["npm run build"]

[start]
# Caches are built at START, not during the build phase. config:cache bakes the
# environment into a single file, and at build time Render has not necessarily
# exposed the same variables the running service sees — a wrong cached config
# is a silent production bug, whereas the ~1s this adds to boot is paid rarely
# once the service is kept warm.
#
# Measured locally, the three caches take a request from ~270ms to ~240ms. That
# is per-request, not just at boot: without them Laravel re-parses every config
# file and recompiles the route table on every single hit.
# Caches are chained with ';' rather than '&&' ON PURPOSE.
#
# With '&&' a failing cache step aborts the whole command and the service never
# starts. That is exactly what happened: `route:cache` exits 1 when two routes
# share a name, so a latent naming collision took the site down and silently
# held back eleven deploys. A cache that cannot be built should cost
# performance, not availability.
#
# migrate still uses '&&' — booting an app against a schema that failed to
# migrate is worse than not booting at all.
cmd = "php artisan migrate --force && php artisan storage:link; php artisan config:cache; php artisan route:cache; php artisan view:cache; php artisan serve --host=0.0.0.0 --port=$PORT"
