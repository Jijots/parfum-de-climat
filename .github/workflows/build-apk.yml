name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend URL — your computer's LAN IP, e.g. http://192.168.1.42/api/v1"
        required: true
        default: "http://parfum.local/api/v1"
      storage_url:
        description: "Laravel Storage URL — same host, e.g. http://192.168.1.42/storage"
        required: true
        default: "http://parfum.local/storage"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --debug \
            --dart-define=BACKEND_URL="${{ github.event.inputs.backend_url }}" \
            --dart-define=STORAGE_URL="${{ github.event.inputs.storage_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: parfum-de-climat-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
